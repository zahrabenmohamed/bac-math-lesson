spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/complexes}
    username: ${DB_USER:complexes}
    password: ${DB_PASSWORD:complexes}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
