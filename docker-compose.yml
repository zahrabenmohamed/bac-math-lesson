services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-complexes}
      POSTGRES_USER: ${DB_USER:-complexes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-complexes}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-complexes} -d ${DB_NAME:-complexes}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-complexes}
      DB_USER: ${DB_USER:-complexes}
      DB_PASSWORD: ${DB_PASSWORD:-complexes}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
